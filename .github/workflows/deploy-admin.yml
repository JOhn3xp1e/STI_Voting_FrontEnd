name: Deploy admin to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - "admin/**"
      - ".github/workflows/deploy-admin.yml"
  workflow_dispatch:

# Never run two deploys at once; a newer push cancels an older queued one.
concurrency:
  group: deploy-admin
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - run: npm ci

      # Builds with OpenNext and deploys the Worker named in wrangler.jsonc (slvp-admin).
      - run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # NEXT_PUBLIC_* values are baked into the bundle at build time.
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_AUTH_DEMO_MODE: ${{ vars.NEXT_PUBLIC_AUTH_DEMO_MODE }}
          NEXT_PUBLIC_ALLOW_DEMO_ON_DEPLOY: ${{ vars.NEXT_PUBLIC_ALLOW_DEMO_ON_DEPLOY }}
